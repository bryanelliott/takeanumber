<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Take A Number{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% block header %}{% include 'ui/_header.html' %}{% endblock %}
  <main id="main-content" tabindex="-1" class="{% block main_class %}container page-content{% endblock %}">
    {% include 'ui/_flashes.html' %}
    {% block content %}{% endblock %}
  </main>
  {% block footer %}{% include 'ui/_footer.html' %}{% endblock %}
</body>
</html>
