<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Take A Number{% endblock %}</title>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <p>Take A Number</p>
    <nav aria-label="Instructor navigation">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('instructor.dashboard') }}">Dashboard</a>
        <form action="{{ url_for('auth.logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Instructor login</a>
        <a href="{{ url_for('auth.signup') }}">Instructor sign-up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
