{% extends 'queue/base.html' %}
{% block content %}
  <section class="panel client-recovery">
    <h2>Unable to open this request</h2>
    <p role="alert">{{ message }}</p>
    {% if public_code %}
      <a class="button" href="{{ url_for('queue.client', public_code=public_code) }}">Reopen session</a>
    {% endif %}
  </section>
{% endblock %}
