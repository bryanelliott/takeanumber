<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take A Number — Student help</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/client.css') }}">
</head>
<body class="client-page">
  {% from 'ui/components.html' import icon %}
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="client-header">
    <div class="client-container">
      <a class="brand" href="{{ url_for('public.landing') }}"><span class="brand-mark">{{ icon('ticket') }}</span>Take A Number</a>
      <span class="client-header-label">Student help</span>
    </div>
  </header>
  <main id="main-content" class="client-container client-main" tabindex="-1">
    <h1 class="screen-reader-only">Student help queue</h1>
    {% block content %}{% endblock %}
  </main>
  <footer class="client-footer client-container">A little more order. More time to learn.</footer>
</body>
</html>
