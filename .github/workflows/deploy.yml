name: Deploy Azure production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    # Repository variable: JSON array of labels for an isolated Linux deployment runner.
    runs-on: ${{ fromJSON(vars.AZURE_DEPLOY_RUNNER_LABELS) }}
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_NAME"
          test -n "$RESOURCE_GROUP"
          [[ "$HEALTH_URL" == https://* ]]
      - name: Install release dependencies in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/release-venv/bin/python" -m pip check
      - name: Authenticate to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check build automation is enabled
        shell: bash
        run: |
          set -euo pipefail
          build=$(az webapp config appsettings list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]" --output tsv)
          [[ "${build,,}" == true ]]
      - name: Apply reviewed, backward-compatible migrations
        shell: bash
        env:
          APP_ENV: production
          FLASK_SKIP_DOTENV: '1'
          SESSION_COOKIE_SECURE: 'true'
          TRUSTED_HOSTS: ${{ vars.APP_TRUSTED_HOSTS }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          # This CLI instance does not serve requests or need the runtime signing key.
          SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')
          export SECRET_KEY
          "$RUNNER_TEMP/release-venv/bin/python" -m flask --app app:create_app deploy-upgrade
      - name: Package only tracked runtime files from the tested commit
        shell: bash
        run: git archive --format=zip --output="$RUNNER_TEMP/release.zip" "$GITHUB_SHA" app migrations requirements.txt startup.sh
      - name: Deploy release
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/release.zip
          startup-command: bash startup.sh
      - name: Check public liveness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --max-time 15 "$HEALTH_URL" | python -c 'import json,sys; assert json.load(sys.stdin) == {"status": "ok"}'
