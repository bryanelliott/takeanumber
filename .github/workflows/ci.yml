name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest (SQL Server)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start disposable SQL Server
        run: docker compose up -d --wait test-db
      - name: Build Python 3.13 and ODBC Driver 18 test environment
        run: docker compose build test-runner
      - name: Check pinned dependencies and Ruff
        run: docker compose run --rm test-runner bash -c 'python -m pip check && python -m ruff check .'
      - name: Pytest (Alembic migrates only the disposable test database)
        run: docker compose run --rm test-runner
      - name: Check Linux startup script
        run: bash -n startup.sh
      - name: Stop disposable SQL Server
        if: always()
        run: docker compose down
