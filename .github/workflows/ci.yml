name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: takeanumber_test
          POSTGRES_USER: takeanumber_test
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U takeanumber_test -d takeanumber_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      SECRET_KEY: ci-only-not-a-production-secret
      SESSION_COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:55432/unused_dev
      TEST_DATABASE_URL: postgresql+psycopg://takeanumber_test:ci_disposable_only@127.0.0.1:55433/takeanumber_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest (migrates only the disposable test database)
        run: python -m pytest
      - name: Check Linux startup script
        run: bash -n startup.sh
